name: registry-versions
on:
  pull_request:
    paths:
      - 'registry/**'
      - 'tools/check_registry_versions.py'
      - '.github/workflows/registry-versions.yml'

jobs:
  published-digests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check_registry_versions.py "$BASE" HEAD
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
