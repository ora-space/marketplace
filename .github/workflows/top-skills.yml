name: top-skills

on:
  push:
    paths:
      - 'examples/top-skills/**'
      - 'registry/t/top-skills/**'
  pull_request:
    paths:
      - 'examples/top-skills/**'
      - 'registry/t/top-skills/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit test the builder
        working-directory: examples/top-skills
        run: python3 -m unittest tools/test_build.py
      - name: Rebuild and verify the committed archives and registry digests
        working-directory: examples/top-skills
        run: python3 tools/build.py --check
